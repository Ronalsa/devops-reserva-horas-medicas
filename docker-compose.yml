# Servicio web de reserva de horas médicas
# Ejecución: docker compose up -d --build
# Acceso:    http://localhost:8080

services:
  web:
    build: .
    image: reserva-horas-medicas:${APP_VERSION:-1.0.0}
    container_name: reserva-horas-web
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - APP_ENV=${APP_ENV:-local}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
